<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ToDo App</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
</head>

<body class="bg-slate-50 min-h-screen">

    <div class="p-5">
        <div class="bg-white shadow-lg rounded-lg p-4 flex justify-between items-center mb-5">
            <h1 class="text-3xl font-bold text-blue-600">Todo Application</h1>
            <div class="flex items-center gap-4">
                <span class="font-semibold text-lg">Welcome {{ request.user.username }}</span>
                <a href="{% url 'logout' %}" class="bg-red-500 text-white px-4 py-2 rounded-md hover:bg-red-600">Logout</a>
            </div>
        </div>

        <div class="flex gap-4">
            <div class="flex-1 border bg-white rounded-lg shadow">
                <div class="text-center text-3xl font-semibold p-3 bg-green-500 text-white rounded-t-lg">Tasks</div>
                <div class="p-2">
                    {% for task in comp_task %}
                    <div class="bg-slate-100 p-3 border shadow my-2 rounded-md flex items-center">
                        <div class="font-bold text-xl flex-1">{{ task.task_name }}</div>
                        <div class="flex gap-3">
                            <a href="{% url 'make_complete' task.pk %}" class="bg-green-500 flex w-9 h-9 justify-center items-center rounded-md text-white">
                                <i class="fa-solid fa-check-double"></i>
                            </a>
                            <a href="{% url 'delete' task.pk %}" class="bg-red-500 flex w-9 h-9 justify-center items-center rounded-md text-white">
                                <i class="fa-solid fa-trash"></i>
                            </a>
                        </div>
                    </div>
                    {% empty %}
                    <p class="text-center text-gray-500 py-4">No pending tasks.</p>
                    {% endfor %}
                </div>
            </div>

            <div class="flex-1 border bg-white rounded-lg shadow">
                <div class="text-center text-3xl font-semibold p-3 bg-red-500 text-white rounded-t-lg">Completed Tasks</div>
                <div class="p-2">
                    {% for ftask in finish_task %}
                    <div class="bg-slate-100 p-3 border shadow my-2 rounded-md flex items-center">
                        <div class="font-bold text-xl flex-1 text-gray-500">{{ ftask.task_name }}</div>
                    </div>
                    {% empty %}
                    <p class="text-center text-gray-500 py-4">No completed tasks.</p>
                    {% endfor %}
                </div>
            </div>
        </div>
    </div>

    <div class="fixed bottom-5 left-0 right-200 px-5">
        <form action="{% url 'add_task' %}" method="post" class="max-w-2xl mx-auto">
            {% csrf_token %}
            <div class="bg-white shadow-xl rounded-lg p-2 flex gap-3 items-center border border-slate-200">
                <input
                    type="text"
                    placeholder="Enter task..."
                    name="task"
                    required
                    class="flex-1 p-3 border rounded-md text-xl font-bold outline-none focus:border-blue-500"
                />
                <button
                    type="submit"
                    class="bg-blue-500 text-white px-6 py-3 rounded-md hover:bg-blue-600 font-bold text-xl"
                >
                    Add Task
                </button>
            </div>
        </form>
    </div>

</body>
</html>
